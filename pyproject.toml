[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vfxforge"
version = "0.1.0"
description = "AI-first Godot VFX authoring model and tooling"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.0", "jsonschema>=4.0"]

[project.scripts]
vfxforge = "vfxforge.cli:main"

[tool.setuptools.packages.find]
include = ["vfxforge*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
vfxforge = ["_revision.txt"]

[tool.setuptools.data-files]
"share/vfxforge/recipes" = ["recipes/*.json"]
"share/vfxforge/policies" = ["policies/*.json"]
"share/vfxforge/schema" = ["schema/*.json"]
"share/vfxforge/godot/runtime" = ["godot/runtime/*.gd"]
"share/vfxforge/godot/host_smoke" = ["godot/host_smoke/*"]
"share/vfxforge/templates/requests" = ["templates/requests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
